services:
  mysql:
    image: mysql:8.4
    container_name: eduspace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eduspace
      MYSQL_USER: eduspace
      MYSQL_PASSWORD: eduspace
    ports:
      - "3307:3306"
    volumes:
      - eduspace-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ueduspace", "-peduspace"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  eduspace-mysql-data:
